name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for documentation-only changes; only run when source/build/test
    # relevant files change. Any change outside docs/** triggers the workflow.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not
        # silently migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        go-version: ['1.26']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: go fmt ./...

      - name: Vet
        run: go vet ./...

      - name: Build test-result summarizer
        # Native stdlib tool (tools/testsummary): consumes `go test -json` and
        # prints a prominent failure report at the END of the run.
        run: go build -o bin/testsummary ./tools/testsummary

      - name: Test
        # Write `go test -json` output to a file first, then feed it to the
        # summarizer. A shell pipe (`|`) is NOT portable across the runners:
        # bash (Linux/macOS) supports it, but PowerShell (Windows) refuses to
        # run an executable in the middle of a pipeline ("Cannot run a
        # document in the middle of a pipeline"). The redirect `>` works in
        # bash, PowerShell, and cmd.exe, and the summarizer now accepts the
        # file path as an argument. A relative path is used (not $GITHUB_TEMP,
        # which is not set on every runner) so the file is always writable.
        # Exit code stays non-zero on failure, so CI still fails exactly as
        # before — only the report is now readable at the end.
        run: |
          go test -json -race -count=1 ./... > test-results.json
          ./bin/testsummary test-results.json

  wasm:
    name: Build WASM
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not silently
    # migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web/main.wasm ./cmd/wasm
      - name: Check WASM size
        run: |
          SIZE=$(wc -c < web/main.wasm)
          echo "WASM size: $SIZE bytes"
          # Warn if larger than 10MB
          if [ $SIZE -gt 10485760 ]; then
            echo "::warning::WASM is larger than 10MB, consider optimization"
          fi

  lint:
    name: Lint
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not silently
    # migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run basic linting (golangci-lint pending Go 1.26 support)
        run: |
          echo "golangci-lint does not yet support Go 1.26. Using basic checks..."
          go vet ./...
          go fmt ./...
