name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for documentation-only changes; only run when source/build/test
    # relevant files change. Any change outside docs/** triggers the workflow.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is intentionally excluded from the test matrix. The
        # `go test -race` step links Go's race runtime, which needs a C
        # compiler — GitHub's windows runners do not ship one, so the step
        # fails there even though macOS (clang) and Linux (gcc/clang) pass.
        # Re-add `windows-latest` once a C toolchain is provisioned for Windows
        # (or drop `-race`) — the test step is already pipe-free, so it is
        # cross-platform-ready apart from that one dependency.
        # ubuntu-26.04-arm (was ubuntu-24.04-arm): the 24.04 arm runner ships a
        # base Go older than go.mod's `go 1.26.4` directive, and setup-go@v7 falls
        # back to the preinstalled toolchain with GOTOOLCHAIN=local, so `go test
        # -race` aborts on a toolchain-mismatch error before building. Ubuntu 26.04
        # ships Go >= 1.26.4, satisfying go.mod even in local-toolchain mode.
        os: [ubuntu-24.04, ubuntu-26.04-arm, macos-latest]
        go-version: ['1.26']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: go fmt ./...

      - name: Vet
        run: go vet ./...

      - name: Build test-result summarizer
        # Native stdlib tool (tools/testsummary): consumes `go test -json` and
        # prints a prominent failure report at the END of the run.
        run: go build -o bin/testsummary ./tools/testsummary

      - name: Test
        # Two goals: (1) surface the failure directly in the CI log, and
        # (2) keep the end-of-run summary from testsummary. The previous
        # `go test -json > file` hid ALL output behind a JSON stream that only
        # the summarizer could read, so a failing test produced exit code 1
        # with nothing to diagnose (this is what made the macOS failure
        # invisible). We therefore:
        #   - run WITHOUT -json and pipe through `tee` so the standard test
        #     output (=== RUN / --- FAIL / race reports / error messages) is
        #     visible in the log AND captured to a file for debugging;
        #   - additionally capture the -json stream for the summarizer.
        # `tee` is a bash utility; the test matrix runs only on ubuntu/* and
        # macos runners (all bash), so a pipe is safe here — unlike the old
        # Windows concern that motivated the original `>` redirect.
        run: |
          # `pipefail` makes this step exit non-zero when the primary plain
          # run fails (tee's own exit code would otherwise mask it).
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test-output.txt
          go test -json -race -count=1 ./... > test-results.json
          ./bin/testsummary test-results.json

  wasm:
    name: Build WASM
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not silently
    # migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web/main.wasm ./cmd/wasm
      - name: Check WASM size
        run: |
          SIZE=$(wc -c < web/main.wasm)
          echo "WASM size: $SIZE bytes"
          # Warn if larger than 10MB
          if [ $SIZE -gt 10485760 ]; then
            echo "::warning::WASM is larger than 10MB, consider optimization"
          fi

  lint:
    name: Lint
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not silently
    # migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run basic linting (golangci-lint pending Go 1.26 support)
        run: |
          echo "golangci-lint does not yet support Go 1.26. Using basic checks..."
          go vet ./...
          go fmt ./...
